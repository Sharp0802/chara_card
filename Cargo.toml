[package]
name = "chara_card"
version = "0.1.0"
edition = "2024"

description = "A library to deal with character card formats and `.charx` in Rust."
repository = "https://github.com/Sharp0802/chara_card.git"
license = "MIT OR Apache-2.0"

[dependencies]
isolang = { version = "2.4", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
paste = "1.0"
serdev = { version = "0.3", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }
winnow = "1.0"

[dev-dependencies]
assert-json-diff = "2.0"
