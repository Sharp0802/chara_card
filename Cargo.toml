[package]
name = "chara_card"
version = "0.1.0"
edition = "2024"

description = "A library to deal with character card formats and `.charx` in Rust."
repository = "https://github.com/Sharp0802/chara_card.git"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = { version = "0.2.24", features = ["serde"] }
